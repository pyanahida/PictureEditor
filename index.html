<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>image preview</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <input type="file" id="file-input" accept="image/*">
    <label for="file-input" class="picker">choose image</label>

    <div class="preview" id="preview-box">
      <span class="placeholder" id="placeholder">no image selected</span>
      <img id="preview-img" class="hidden" src="#" alt="preview">
    </div>

    <div class="filename" id="filename"></div>

    <div class="controls">
      <div class="control-row">
        <label for="exposure-input" class="control-label">exposure</label>
        <input type="number" id="exposure-input" class="control-input" min="-100" max="100" value="0" step="1">
      </div>
      <div class="control-row">
        <label for="brightness-input" class="control-label">brightness</label>
        <input type="number" id="brightness-input" class="control-input" min="-100" max="100" value="0" step="1">
      </div>
      <div class="control-row">
        <label for="contrast-input" class="control-label">contrast</label>
        <input type="number" id="contrast-input" class="control-input" min="-100" max="100" value="0" step="1">
      </div>
      <div class="control-row">
        <label for="clarity-input" class="control-label">clarity</label>
        <input type="number" id="clarity-input" class="control-input" min="-100" max="100" value="0" step="1">
      </div>
      <div class="control-row">
        <label for="highlights-input" class="control-label">highlights</label>
        <input type="number" id="highlights-input" class="control-input" min="-100" max="100" value="0" step="1">
      </div>
      <div class="control-row">
        <label for="shadows-input" class="control-label">shadows</label>
        <input type="number" id="shadows-input" class="control-input" min="-100" max="100" value="0" step="1">
      </div>
      <div class="control-row">
        <label for="whites-input" class="control-label">whites</label>
        <input type="number" id="whites-input" class="control-input" min="-100" max="100" value="0" step="1">
      </div>
      <div class="control-row">
        <label for="blacks-input" class="control-label">blacks</label>
        <input type="number" id="blacks-input" class="control-input" min="-100" max="100" value="0" step="1">
      </div>
      <div class="control-row">
        <label for="saturation-input" class="control-label">saturation</label>
        <input type="number" id="saturation-input" class="control-input" min="-100" max="100" value="0" step="1">
      </div>
      <div class="control-row">
        <label for="vibrance-input" class="control-label">vibrance</label>
        <input type="number" id="vibrance-input" class="control-input" min="-100" max="100" value="0" step="1">
      </div>
      <div class="button-row">
        <button id="apply-btn" class="action-btn" disabled>apply</button>
        <button id="download-btn" class="action-btn" disabled>download</button>
      </div>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
