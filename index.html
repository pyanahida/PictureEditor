<!DOCTYPE html>
<html lang="en">
<head>
  <link rel="icon" type="image/png" href="/favicon.png">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>picture editor</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <h1 class="title">picture editor</h1>

    <input type="file" id="file-input" accept="image/*">
    <label for="file-input" class="picker">choose image</label>

    <div class="preview" id="preview-box">
      <span class="placeholder" id="placeholder">no image selected</span>
      <img id="preview-img" class="hidden" src="" alt="preview">
    </div>

    <div class="filename" id="filename"></div>

    <div class="controls" id="controls"></div>

    <div class="button-row">
      <button id="hsl-btn" class="action-btn secondary">HSL</button>
      <button id="posterization-btn" class="action-btn secondary">Posterization</button>
      <button id="curves-btn" class="action-btn secondary">Curves</button>
    </div>
    
    <div class="button-row">
      <button id="apply-btn" class="action-btn" disabled>apply</button>
      <button id="download-btn" class="action-btn" disabled>download</button>
    </div>

    <!-- New JPEG Quality Row -->
    <div class="button-row jpeg-row">
      <input type="range" id="jpeg-quality" class="control-slider" min="1" max="100" value="90">
      <span class="control-value" id="jpeg-quality-val">90</span>
      <button id="download-jpeg-btn" class="action-btn" disabled>download jpeg</button>
    </div>

    <div class="button-row">
      <button id="save-preset-btn" class="action-btn secondary">Save Preset</button>
      <button id="load-preset-btn" class="action-btn secondary">Load Preset</button>
      <input type="file" id="preset-input" accept=".json" style="display: none;">
    </div>

    <!-- HSL Modal -->
    <div class="modal-overlay hidden" id="hsl-modal">
      <div class="modal-content">
        <div class="modal-header">
          <h2 class="modal-title">HSL</h2>
          <button class="close-btn" id="close-hsl">&times;</button>
        </div>
        <div id="hsl-grid"></div>
      </div>
    </div>

    <!-- Posterization Modal -->
    <div class="modal-overlay hidden" id="posterization-modal">
      <div class="modal-content">
        <div class="modal-header">
          <h2 class="modal-title">Posterization</h2>
          <button class="close-btn" id="close-posterization">&times;</button>
        </div>
        <div id="posterization-grid"></div>
      </div>
    </div>

    <!-- Curves Modal -->
    <div class="modal-overlay hidden" id="curves-modal">
      <div class="modal-content">
        <div class="modal-header">
          <h2 class="modal-title">Curves</h2>
          <button class="close-btn" id="close-curves">&times;</button>
        </div>
        <div class="curves-container">
          <div class="curves-grid" id="curves-grid"></div>
          <div class="curves-actions">
            <button id="delete-point-btn" class="action-btn secondary" disabled>Delete Point</button>
          </div>
        </div>
      </div>
    </div>
  </main>

  <script src="utils.js"></script>
  <script src="pipeline.js"></script>
  <script src="ui.js"></script>
  <script src="app.js"></script>
</body>
</html>
