<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>image preview</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #fafafa;
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
    }

    .container {
      max-width: 560px;
      width: 100%;
    }

    /* minimal file picker */
    .picker {
      display: inline-block;
      background: #111;
      color: #fff;
      font-size: 0.95rem;
      font-weight: 500;
      padding: 0.7rem 1.5rem;
      border-radius: 40px;
      cursor: pointer;
      letter-spacing: 0.01em;
      transition: background 0.15s;
      margin-bottom: 1.5rem;
    }

    .picker:hover {
      background: #2a2a2a;
    }

    #file-input {
      display: none;
    }

    /* preview area — plain, minimal */
    .preview {
      background: #fff;
      border-radius: 20px;
      border: 1px solid #e5e5e5;
      min-height: 240px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 1.5rem;
      transition: border-color 0.15s;
    }

    .preview.active {
      border-color: #ccc;
    }

    .preview img {
      max-width: 100%;
      max-height: 400px;
      width: auto;
      height: auto;
      display: block;
      border-radius: 12px;
    }

    .preview img.hidden {
      display: none;
    }

    .placeholder {
      color: #aaa;
      font-size: 0.95rem;
      text-align: center;
    }

    .placeholder.hidden {
      display: none;
    }

    /* optional: tiny filename note, kept subtle */
    .filename {
      font-size: 0.8rem;
      color: #999;
      margin-top: 0.9rem;
      text-align: center;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .filename:empty {
      display: none;
    }
  </style>
</head>
<body>
  <div class="container">
    <input type="file" id="file-input" accept="image/*">
    <label for="file-input" class="picker">choose image</label>

    <div class="preview" id="preview-box">
      <span class="placeholder" id="placeholder">no image selected</span>
      <img id="preview-img" class="hidden" src="#" alt="preview">
    </div>

    <div class="filename" id="filename"></div>
  </div>

  <script>
    (function() {
      const fileInput = document.getElementById('file-input');
      const previewImg = document.getElementById('preview-img');
      const placeholder = document.getElementById('placeholder');
      const previewBox = document.getElementById('preview-box');
      const filenameEl = document.getElementById('filename');

      let objectUrl = null;

      function clearPreview() {
        if (objectUrl) {
          URL.revokeObjectURL(objectUrl);
          objectUrl = null;
        }
        previewImg.src = '#';
        previewImg.classList.add('hidden');
        placeholder.classList.remove('hidden');
        previewBox.classList.remove('active');
        filenameEl.textContent = '';
      }

      function showImage(file) {
        // release previous url
        if (objectUrl) {
          URL.revokeObjectURL(objectUrl);
        }

        objectUrl = URL.createObjectURL(file);
        previewImg.src = objectUrl;
        previewImg.classList.remove('hidden');
        placeholder.classList.add('hidden');
        previewBox.classList.add('active');

        // subtle filename
        const name = file.name;
        filenameEl.textContent = name.length > 40 ? name.slice(0, 38) + '…' : name;
      }

      function handleFileChange(e) {
        const files = e.target.files;

        if (!files || files.length === 0) {
          clearPreview();
          return;
        }

        const file = files[0];
        if (file.type.startsWith('image/')) {
          showImage(file);
        } else {
          // non-image (though accept="image/*" should filter)
          clearPreview();
          filenameEl.textContent = 'not an image';
          fileInput.value = '';
        }
      }

      // reset input so the same file can be chosen again (triggers change)
      fileInput.addEventListener('click', function() {
        this.value = '';
      });

      fileInput.addEventListener('change', handleFileChange);

      // clean up object url on page unload
      window.addEventListener('beforeunload', function() {
        if (objectUrl) {
          URL.revokeObjectURL(objectUrl);
          objectUrl = null;
        }
      });

      // start clean
      clearPreview();
    })();
  </script>
</body>
</html>
