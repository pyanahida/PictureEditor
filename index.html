<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>picture editor</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="container">
    <h1 class="title">picture editor</h1>

    <input type="file" id="file-input" accept="image/*">
    <label for="file-input" class="picker">choose image</label>

    <div class="preview" id="preview-box">
      <span class="placeholder" id="placeholder">no image selected</span>
      <img id="preview-img" class="hidden" src="" alt="preview">
    </div>

    <div class="filename" id="filename"></div>

    <div class="controls" id="controls"></div>

    <div class="button-row">
      <button id="hsl-btn" class="action-btn secondary">HSL</button>
      <button id="apply-btn" class="action-btn" disabled>apply</button>
      <button id="download-btn" class="action-btn" disabled>download</button>
    </div>

    <!-- HSL Modal -->
    <div class="modal-overlay hidden" id="hsl-modal">
      <div class="modal-content">
        <div class="modal-header">
          <h2 class="modal-title">HSL</h2>
          <button class="close-btn" id="close-hsl">&times;</button>
        </div>
        <div class="hsl-grid" id="hsl-grid">
          <!-- Grid will be generated by JS -->
        </div>
      </div>
    </div>
  </main>

  <script src="script.js"></script>
</body>
</html>
